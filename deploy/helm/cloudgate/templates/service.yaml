apiVersion: v1
kind: Service
metadata:
  name: {{ include "cloudgate.fullname" . }}-gateway
  labels:
    {{- include "cloudgate.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "cloudgate.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
    - name: metrics
      port: {{ .Values.service.metricsPort }}
      targetPort: metrics
      protocol: TCP
    - name: grpc
      port: {{ .Values.service.grpcPort }}
      targetPort: 50051
      protocol: TCP
---
{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "cloudgate.fullname" . }}-gateway
  labels:
    {{- include "cloudgate.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "cloudgate.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: gateway
{{- end }}
---
{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "cloudgate.fullname" . }}
  labels:
    {{- include "cloudgate.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "cloudgate.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: metrics
      interval: {{ .Values.serviceMonitor.interval }}
      path: {{ .Values.serviceMonitor.path }}
{{- end }}
