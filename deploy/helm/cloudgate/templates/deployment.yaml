apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cloudgate.fullname" . }}-gateway
  labels:
    {{- include "cloudgate.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "cloudgate.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: gateway
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        {{- include "cloudgate.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 30
      containers:
        - name: gateway
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          env:
            - name: CLOUDGATE_SERVER_ADDR
              value: ":8080"
            - name: CLOUDGATE_SERVER_METRICS_ADDR
              value: ":9090"
            - name: CLOUDGATE_REDIS_ADDRS
              value: {{ .Values.redis.addr | quote }}
            - name: CLOUDGATE_CASSANDRA_HOSTS
              value: {{ .Values.cassandra.hosts | quote }}
            - name: CLOUDGATE_CASSANDRA_KEYSPACE
              value: {{ .Values.cassandra.keyspace | quote }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
