version: "2"
run:
  tests: true
linters:
  default: none
  enable:
    - bodyclose
    - errcheck
    - goconst
    - gocritic
    - goprintffuncname
    - gosec
    - govet
    - ineffassign
    - misspell
    - mnd
    - noctx
    - nolintlint
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
    - whitespace
  settings:
    dupl:
      threshold: 100
    funlen:
      lines: 80
      statements: 50
    goconst:
      min-len: 2
      min-occurrences: 2
    gocritic:
      disabled-checks:
        # audit.Event (120 bytes) is passed by value through the AuditLogger
        # interface on purpose: callers cannot mutate a queued event.
        - hugeParam
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style
    gocyclo:
      min-complexity: 18
    govet:
      enable:
        - shadow
    misspell:
      locale: US
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - goconst
          - gosec
          - mnd
        path: _test\.go
      - linters:
          - revive
          - staticcheck
        path: proto/
      # Metric subsystem, name, and label strings read best inline next to
      # their help text; repeating "upstream" or "tenant" is not duplication.
      - linters:
          - goconst
        path: internal/metrics/
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/aryaMehta26/cloudgate
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
