linters-settings:
  gocyclo:
    min-complexity: 18
  funlen:
    lines: 80
    statements: 50
  dupl:
    threshold: 100
  goconst:
    min-len: 2
    min-occurrences: 2
  gocritic:
    disabled-checks:
      # audit.Event (120 bytes) is passed by value through the AuditLogger
      # interface on purpose: callers cannot mutate a queued event.
      - hugeParam
    enabled-tags:
      - diagnostic
      - experimental
      - opinionated
      - performance
      - style
  goimports:
    local-prefixes: github.com/aryaMehta26/cloudgate
  govet:
    enable:
      - shadow
  misspell:
    locale: US

linters:
  disable-all: true
  enable:
    - bodyclose
    - errcheck
    - exportloopref
    - goconst
    - gocritic
    - gofmt
    - goimports
    - mnd
    - goprintffuncname
    - gosec
    - gosimple
    - govet
    - ineffassign
    - misspell
    - noctx
    - nolintlint
    - revive
    - staticcheck
    - stylecheck
    - typecheck
    - unconvert
    - unparam
    - unused
    - whitespace

run:
  timeout: 5m
  tests: true

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - mnd
        - gosec
        - goconst
    - path: proto/
      linters:
        - revive
        - stylecheck
